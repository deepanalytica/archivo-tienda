name: Brand production vector audit

on:
  push:
    branches: [feature/archivo-produccion-11-marcas]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-brand-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 99 SVG prototypes and manifests
        run: python scripts/verify-brand-production.py
