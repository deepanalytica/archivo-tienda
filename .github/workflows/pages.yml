name: Verify and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Full browser regression on PRs/manual runs. Main has already passed PR checks.
      - name: Install Playwright for full validation
        if: github.event_name != 'push'
        run: npx playwright install --with-deps chromium
      - name: Full test suite
        if: github.event_name != 'push'
        run: npm test
      # Deployment rebuilds a fresh Pages artifact without re-downloading browsers.
      - name: Build and validate published site
        if: github.event_name == 'push'
        run: |
          npm run build
          node scripts/verify-studio.cjs
          node scripts/verify-brand-platform.cjs
          node scripts/verify-premium-commerce.cjs
          node scripts/audit-sku-production.cjs
          python scripts/verify-brand-production.py
      - name: Upload verified site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
